title = "AGY SOTA Harness Secret & Broker Account Privacy Gate"

[extend]
useDefault = true

[[rules]]
id = "alpaca-paper-account-id"
description = "Alpaca Paper Account ID (PA...)"
regex = '''\bPA[0-9A-Z]{10}\b'''
tags = ["account-id", "alpaca"]

[[rules]]
id = "ibkr-paper-account-id"
description = "IBKR Paper Account ID (DU...)"
regex = '''\bDU[0-9]{7,9}\b'''
tags = ["account-id", "ibkr"]

[[rules]]
id = "alpaca-api-key-id"
description = "Alpaca Live/Paper API Key Prefix"
regex = '''\b(?:AK|PK)[0-9A-Z]{20}\b'''
tags = ["api-key", "alpaca"]
