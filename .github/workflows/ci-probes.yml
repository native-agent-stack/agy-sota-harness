name: AGY SOTA Harness Deterministic Gate & ADR Parity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-sota-gates:
    name: Ruff + Ty + MADR 4.0 Catalog + Merge Gate + Hypothesis + Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --locked --python 3.14

      - name: Ruff lint check
        run: uvx ruff check .

      - name: Ty static type check
        run: uvx ty check src scripts harness --python .venv

      - name: Verify MADR 4.0 GitHub-evidenced ADR catalog & manifest zero drift
        run: uv run python scripts/architecture_catalog.py --check

      - name: Verify UPSTREAM.md coverage & zero-leak privacy merge gate
        run: uv run python scripts/merge_gate.py

      - name: Run Hypothesis property & pre-wall causal unit suite
        run: uv run pytest -q

      - name: Gitleaks (SHA-256 verified binary)
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          "$RUNNER_TEMP/gitleaks" git --verbose "$GITHUB_WORKSPACE"
