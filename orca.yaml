# Orca (https://github.com/stablyai/orca) workspace recipe for agy-sota-harness
# Ensures every new worktree installs pinned L0 CLI tools + locked Python quant stack before the agent starts.
scripts:
  setup: |
    mise trust
    mise install --yes
    mise exec -- uv sync --locked
setupAgentStartupPolicy: wait-for-setup
defaultTabs:
  - title: Agent
  - title: AGY L0-L12 Probes
    command: mise exec -- uv run python harness/run_probes.py
  - title: SOTA Property & Merge Suite
    command: mise exec -- uv run pytest
