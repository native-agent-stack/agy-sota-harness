# Orca (https://github.com/stablyai/orca) workspace recipe for agy-sota-harness
# Ensures every new worktree installs locked Python quant stack across Win32 PowerShell, macOS zsh, and Linux bash.
scripts:
  setup: |
    uv sync --locked
setupAgentStartupPolicy: wait-for-setup
defaultTabs:
  - title: Agent
  - title: AGY L0-L12 Probes
    command: uv run python harness/run_probes.py
  - title: SOTA Property & Merge Suite
    command: uv run pytest
